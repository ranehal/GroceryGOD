# FoodiBD Scraper Configuration
# Run daily via cron: python scraper.py

# Target shop
shop:
  id: 11617
  name: "Foodimart - Banasree"
  latitude: 23.7518923
  longitude: 90.4340251

# API settings
api:
  base_url: "https://imrs.foodibd.com"
  image_resize_url: "https://imrs.foodibd.com/api/v1/image-resize"
  user_agent: "ktor-client"
  origin: "foodi-prod-android 8.0.3 16 1b5a4567bbcb95d4"
  content_type: "application/json"
  auth_header: "x-requested-with"
  guest_mode: true

# Scraping behavior
scraping:
  page_size: 20
  max_concurrent_requests: 3
  rate_limit_per_second: 2.0
  max_retries: 3
  retry_delay_seconds: 2.0
  timeout_seconds: 30
  delivery_time: "2026-07-23T10:35:00.000Z"

