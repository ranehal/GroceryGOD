name: Update catalog data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *" # 06:30 Asia/Dhaka

permissions:
  contents: write

concurrency:
  group: meena-data-update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scrape.py
        env:
          MEENA_BEARER_TOKEN: ${{ secrets.MEENA_BEARER_TOKEN }}
          MEENA_AREA_ID: "265"
          MEENA_SUBUNIT_ID: "11"
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git diff --cached --quiet || git commit -m "data: update Meena Bazar catalog"
          git push
